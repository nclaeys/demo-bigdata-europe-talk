version: 2

sources:
  - name: conf
    schema: "{{target.schema}}_raw"
    description: Conference data
    meta:
      external_location: >-
        {{ 'read_csv_auto("abfs://data/raw/{name}.csv", header=1)' if target.name != 'local' else 'read_csv_auto("data/{name}.csv", header=1)' }}
    tables:
      - name: attendance
        description: One record per attendee per session
      - name: sessions
        description: One record per session on the Bigdata Vilnius 2025 agenda
      - name: feedback
        description: One record per feedback submission per session
      - name: attendees
        description: One record per attendee
